<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Login - Freelance Manager</title>
  <link rel="stylesheet" href="style.css">
</head>
<body class="auth">
  <div class="auth-card">
    <h1>Freelance Manager</h1>
    <p class="sub">Manage your clients, projects and invoices.</p>
    <input type="email" id="email" placeholder="Email">
    <input type="password" id="password" placeholder="Password">
    <button id="loginBtn">Login</button>
    <button id="signupBtn" class="secondary">Create account</button>
    <button id="googleBtn" class="secondary">Continue with Google</button>
    <p id="message"></p>
  </div>
  <script type="module" src="login.js"></script>
</body>
</html>
