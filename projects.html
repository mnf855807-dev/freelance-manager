<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Projects - Freelance Manager</title>
  <link rel="stylesheet" href="style.css">
</head>
<body class="app">
  <div class="sidebar">
    <div class="brand">Freelance Manager</div>
    <a href="dashboard.html">Dashboard</a>
    <a href="clients.html">Clients</a>
    <a href="projects.html" class="active">Projects</a>
    <a href="invoices.html">Invoices</a>
  </div>

  <div class="main">
    <h1>Projects</h1>
    <p class="sub">Track the work you do for each client.</p>

    <div class="card">
      <h2>Add project</h2>
      <label>Client</label>
      <select id="clientSelect"></select>
      <input type="text" id="title" placeholder="Project title">
      <input type="number" id="price" placeholder="Price (SAR)">
      <label>Deadline</label>
      <input type="date" id="deadline">
      <label>Status</label>
      <select id="status">
        <option>Not started</option>
        <option>In progress</option>
        <option>Done</option>
      </select>
      <button id="addBtn">Add project</button>
    </div>

    <div class="card">
      <h2>All projects</h2>
      <ul id="projectList"></ul>
    </div>
  </div>

  <script type="module" src="projects.js"></script>
</body>
</html>
