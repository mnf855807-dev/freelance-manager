<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Clients - Freelance Manager</title>
  <link rel="stylesheet" href="style.css">
</head>
<body class="app">
  <div class="sidebar">
    <div class="brand">Freelance Manager</div>
    <a href="dashboard.html">Dashboard</a>
    <a href="clients.html" class="active">Clients</a>
    <a href="projects.html">Projects</a>
    <a href="invoices.html">Invoices</a>
  </div>

  <div class="main">
    <h1>Clients</h1>
    <p class="sub">People and companies you work for.</p>

    <div class="card">
      <h2>Add client</h2>
      <input type="text" id="name" placeholder="Name">
      <input type="text" id="phone" placeholder="Phone">
      <input type="email" id="email" placeholder="Email">
      <button id="addBtn">Add client</button>
    </div>

    <div class="card">
      <h2>All clients</h2>
      <input type="text" id="search" placeholder="Search clients...">
      <ul id="clientList"></ul>
    </div>
  </div>

  <script type="module" src="clients.js"></script>
</body>
</html>
