<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Dashboard - Freelance Manager</title>
  <link rel="stylesheet" href="style.css">
</head>
<body class="app">
  <div class="sidebar">
    <div class="brand">Freelance Manager</div>
    <a href="dashboard.html" class="active">Dashboard</a>
    <a href="clients.html">Clients</a>
    <a href="projects.html">Projects</a>
    <a href="invoices.html">Invoices</a>
    <div class="bottom">
      <div class="user" id="userEmail"></div>
      <button id="logoutBtn">Logout</button>
    </div>
  </div>

  <div class="main">
    <h1>Dashboard</h1>
    <p class="sub">Your freelance business at a glance.</p>

    <div class="stats">
      <div class="stat">
        <div class="label">Total earned</div>
        <div class="value green"><span id="totalPaid">0</span> SAR</div>
      </div>
      <div class="stat">
        <div class="label">Still owed</div>
        <div class="value red"><span id="totalUnpaid">0</span> SAR</div>
      </div>
      <div class="stat">
        <div class="label">Clients</div>
        <div class="value" id="clientCount">0</div>
      </div>
      <div class="stat">
        <div class="label">Active projects</div>
        <div class="value" id="activeCount">0</div>
      </div>
    </div>

    <div class="card">
      <h2>Upcoming deadlines</h2>
      <ul id="deadlineList"></ul>
    </div>
  </div>
  <div class="card">
    <h2>Income by month</h2>
    <div class="chart-box">
      <canvas id="incomeChart"></canvas>
    </div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.3/dist/chart.umd.min.js"></script>
  <script type="module" src="dashboard.js"></script>
</body>
</html>
