<!doctype html>
<html lang="en" dir="ltr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Freelance Manager</title>
  <link rel="icon" href="logo.svg" type="image/svg+xml">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=IBM+Plex+Sans+Arabic:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="styles.css">
  <script>

  <link rel="preload" href="login.css" as="style">

  <script type="module" src="app.js"></script>
</head>
<body>
  <div id="app">
    <div class="app-shell">
      <aside class="sidebar"></aside>
      <div class="main-shell"><header class="topbar"></header><main></main></div>
    </div>
  </div>

</html>
