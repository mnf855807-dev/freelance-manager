<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Invoices - Freelance Manager</title>
  <link rel="stylesheet" href="style.css">
</head>
<body class="app">
  <div class="sidebar">
    <div class="brand">Freelance Manager</div>
    <a href="dashboard.html">Dashboard</a>
    <a href="clients.html">Clients</a>
    <a href="projects.html">Projects</a>
    <a href="invoices.html" class="active">Invoices</a>
  </div>

  <div class="main">
    <h1>Invoices</h1>
    <p class="sub">See what is paid and what is still owed.</p>

    <div class="card">
      <h2>Add invoice</h2>
      <label>Project</label>
      <select id="projectSelect"></select>
      <input type="number" id="amount" placeholder="Amount (SAR)">
      <label>Due date</label>
      <input type="date" id="dueDate">
      <label>Status</label>
      <select id="status">
        <option>Unpaid</option>
        <option>Paid</option>
      </select>
      <button id="addBtn">Add invoice</button>
    </div>

    <div class="card">
      <h2>All invoices</h2>
      <ul id="invoiceList"></ul>
    </div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/jspdf@2.5.1/dist/jspdf.umd.min.js"></script>
  <script type="module" src="invoices.js"></script>
</body>
</html>
